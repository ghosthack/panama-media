name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version to build the dry-run bundle as (not committed)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 26
          cache: maven

      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Refusing to publish snapshot version: $version" >&2
            exit 1
          fi
          expected_tag="v${version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag '$RELEASE_TAG' must match '$expected_tag'." >&2
            exit 1
          fi

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 26 and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 26
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Deploy to Maven Central
        run: ./mvnw -B -ntp clean deploy -Prelease
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # Manual runs only build and sign the Central bundle (never uploaded) so it
  # can be inspected and validated without publishing. The job only gets
  # placeholder Central credentials, so it cannot upload anything.
  bundle-dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 26 and signing key
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 26
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Build Central bundle without publishing
        shell: bash
        run: |
          set -uo pipefail
          ./mvnw -v
          if [[ -n "$DRY_RUN_VERSION" ]]; then
            ./mvnw -B -ntp -q versions:set -DnewVersion="$DRY_RUN_VERSION" -DgenerateBackupPoms=false || exit 1
          fi
          # skipPublishing would also skip bundling, so let the upload fail
          # against an unreachable URL instead and keep the bundle it built.
          ./mvnw -B -ntp clean deploy -Prelease -DcentralBaseUrl=http://127.0.0.1:9 -DcentralSnapshotsUrl=http://127.0.0.1:9 || true
          set -e
          test -f target/central-publishing/central-bundle.zip
          unzip -l target/central-publishing/central-bundle.zip
          if unzip -Z1 target/central-publishing/central-bundle.zip | grep -E '(_remote\.repositories|maven-metadata-local\.xml)'; then
            echo "::error::Central bundle contains local resolver files" >&2
            exit 1
          fi
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
          MAVEN_CENTRAL_USERNAME: dry-run
          MAVEN_CENTRAL_PASSWORD: dry-run
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: target/central-publishing/central-bundle.zip
