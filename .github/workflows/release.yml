name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 26 and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 26
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Refusing to publish snapshot version: $version" >&2
            exit 1
          fi
          expected_tag="v${version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag '$RELEASE_TAG' must match '$expected_tag'." >&2
            exit 1
          fi

      - name: Deploy to Maven Central
        run: mvn -B -ntp clean deploy -Prelease
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
